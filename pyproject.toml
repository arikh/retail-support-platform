[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-support-platform"
version = "0.1.0"
description = "Production-grade multi-agent retail customer-support platform on LangGraph — supervisor + specialist workers, durable checkpointing, human-in-the-loop, PII-by-design."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retail_support"]

[tool.ruff.lint]
select = ["E", "F", "I"]
